<!DOCTYPE html>
<html lang="hr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Capsula</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <button id="backBtn" class="back hidden" onclick="goHome()">⬅ Natrag</button>

    <header class="hero">
        <h1>TIME CAPSULA</h1>
        <p>Odaberi što želiš otvoriti</p>
    </header>

    <section class="menu">

        <div class="card" onclick="showSection('slike')">
            <h2>📸 Slike</h2>
        </div>

        <div class="card" onclick="showSection('intervjui')">
            <h2>🎤 Intervjui</h2>
        </div>

        <div class="card" onclick="showSection('glazba')">
            <h2>🎵 Glazba</h2>
        </div>

    </section>

    <section id="slike" class="hidden page">

        <h2>Slike</h2>

        <div class="content">
            <img src="slike/slika1.jpg" onclick="openLightbox(this.src)">
            <img src="slike/slika2.jpg" onclick="openLightbox(this.src)">
            <img src="slike/slika3.jpg" onclick="openLightbox(this.src)">
            <img src="slike/slika4.jpg" onclick="openLightbox(this.src)">
            <img src="slike/slika5.jpg" onclick="openLightbox(this.src)">
            <img src="slike/slika6.jpg" onclick="openLightbox(this.src)">
            <img src="slike/slika7.jpg" onclick="openLightbox(this.src)">
            <img src="slike/slika8.jpg" onclick="openLightbox(this.src)">
            <img src="slike/slika9.jpg" onclick="openLightbox(this.src)">
        </div>

    </section>

    <section id="intervjui" class="hidden page">

        <h2>Intervjui</h2>

        <div class="content">

            <div class="card">
                <h3>🎤 Učenik 1</h3>
                <video width="400" controls>
                    <source src="videi/amarie.mp4" type="video/mp4">
                </video>
            </div>

            <div class="card">
                <h3>🎤 Učenik 2</h3>
                <video width="400" controls>
                    <source src="videi/gregor.mp4" type="video/mp4">
                </video>
            </div>

            <div class="card">
                <h3>🎤 Učenik 3</h3>
                <video width="400" controls>
                    <source src="videi/matej.mp4" type="video/mp4">
                </video>
            </div>

        </div>
    </section>

    <section id="glazba" class="hidden page">

        <h2>Glazba</h2>

        <ul>
            <li>
                🎵 <a href="https://www.youtube.com/watch?v=iuyqJv049Io" target="_blank">
                    Vojko V &amp; Grše - Šibenik
                </a>
            </li>

            <li>
                🎵 <a href="https://www.youtube.com/results?search_query=Danijel+Veršić+Lovran+gradić+mali" target="_blank">
                    Danijel Veršić - Lovran, gradić mali
                </a>
            </li>

            <li>
                🎵 <a href="https://www.youtube.com/watch?v=RzFU2AXKTLc" target="_blank">
                    Desingerica - Djeuskavac
                </a>
            </li>
        </ul>

    </section>

    <div id="lightbox" class="lightbox hidden" onclick="closeLightbox()">
        <img id="lightbox-img">
    </div>

    <script src="script.js"></script>

</body>

</html>
